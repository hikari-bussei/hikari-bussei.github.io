<a name="OnlineRegi"><h1 align="center">論文書式</h1></a>

<hr>


<ul>
  <li>論文は<b>各発表4頁</b>です。<b>論文の提出が発表の条件</b>になります。
      <p>
  <li>論文集は<b>白黒(グレースケール)で印刷・発刊</b>されます。
      <p>
      <ul>
        <li>論文PDFファイルで、白黒(グレースケール)印刷されると色などの識別が困難なものが多々見受けられます。
            <p>
        <li>登録される際には、白黒(グレースケール)印刷でも鮮明であるかご確認いただきますよう、お願いいたします。
      </ul>
      <p>
  <li><a href="pdf/Paper-Sample-01BW.pdf">論文書式の例</a>
      <p>
</ul>
