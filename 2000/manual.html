<H1><B>ポスター発表について</B></H1>
</CENTER>
<hr>

<BR>
<DL>
  <DT><B>ポスター板の大きさ</B><P>
  <DD>ポスター発表1件あたり、縦 175cm, 横 90cmの板を用意しています。
      <P>
  <DT><B>ショートプレゼンテーション</B><P>
  <DD>各ポスター発表につき<b><font color="red">3分間</font></b>のショート
      プレゼンテーション（口頭発表）を行います。そのためのOHPシートをご用
      意ください。質疑応答は行いません。また、論文数が多いため、
      <b><font color="red">時間厳守でお願いします。 </font></b>
      <P>
</DL>
