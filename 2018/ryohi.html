<h1 align="center">光物性研究会旅費サポートのお知らせ</h1>

<hr>

<p>
光物性研究会参加者の皆様
</p>

<p>
&nbsp;今年度の参加者も確定し、予算の目処も立ちましたので、少々遅くなりましたが、
例年並みの旅費補助の募集をしたいと思います。
<br>
&nbsp;関西圏内以外から来られる学生の講演者に対して、片道の旅費の援助をしたいと思います。
</p>

<p>
ご希望の大学の代表者の方は、<br>
&nbsp;&nbsp;田中耕一郎<br>
&nbsp;&nbsp;<IMG SRC="gif/email-kochan.png"><br>
までメールいただけますか？
</p>

<p>
&nbsp;応募のためのエクセルファイルを折り返しお送りします。
<br>
締め切りは、１１月３０日とさせていただきます。
</p>

<p>
よろしくお願いいたします。
</p>

<p>
光物性研究会組織委員長<br>
田中耕一郎
